# FreeLLMAPI — on-premise Docker Compose
#
# 원본 compose: https://github.com/tashfeenahmed/freellmapi/blob/main/docker-compose.yml
# 사용법:       https://github.com/Juser0/setup-instructions#1-freellmapi-docker-on-premise
#
# - 같은 디렉터리에 .env 가 있어야 한다 (env_file: .env)
# - 소스 빌드 없이 배포 이미지만 사용한다 (image 만 지정)
# - 데이터는 named volume `freellmapi-data` 에 남는다 (삭제하려면 down -v)

services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      # 대시보드 "Update now" (Watchtower sidecar) 가 호출할 주소.
      # autoupdate 프로필을 켜지 않으면 아무도 쓰지 않는다.
      FREELLMAPI_SELF_UPDATE_URL: http://watchtower:8080
      FREELLMAPI_SELF_UPDATE_TOKEN: ${WATCHTOWER_TOKEN:-}
    labels:
      # Watchtower 는 아래 두 라벨을 모두 가진 컨테이너만 건드린다.
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: freellmapi
    # 기본은 localhost 전용. 서버/LAN 공개는 .env 의 HOST_BIND=0.0.0.0
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    # 컨테이너에서 호스트를 가리키는 이름. 호스트에 설치한 프록시를
    # (Clash, v2rayN, 사내 프록시) 쓸 때 PROXY_URL=socks5h://host.docker.internal:7890
    # 로 쓰기 위해 필요하다. Docker Desktop 은 기본 제공, 리눅스 Docker 는 이 설정이 필요.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # 선택: 대시보드 Settings → Check for updates → "Update now".
  #   docker compose --profile autoupdate up -d   (.env 에 WATCHTOWER_TOKEN 필요)
  # docker.sock 을 마운트하므로 호스트 root 동급 권한이 된다. 필요 없으면 끄 둔다.
  watchtower:
    image: nickfedor/watchtower:1.22.3
    profiles: ["autoupdate"]
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: update
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:-}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCOPE: freellmapi
      WATCHTOWER_CLEANUP: "true"
    labels:
      com.centurylinklabs.watchtower.scope: freellmapi
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  freellmapi-data:
    # 이름 고정 — 백업 스크립트에서 `freellmapi-data` 로 그대로 참조할 수 있게 한다
    name: freellmapi-data
